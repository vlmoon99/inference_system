# LiteLLM Proxy: the one door every project uses. Model names here are the public API ids.
# Add a machine = add another deployment under the same model_name; LiteLLM load-balances.
model_list:
  - model_name: qwen3.6-35b
    model_info: {mode: chat}
    litellm_params:
      model: hosted_vllm/nvidia/Qwen3.6-35B-A3B-NVFP4
      api_base: http://127.0.0.1:8010/v1
      timeout: 600

  - model_name: qwen3-embedding-0.6b
    model_info: {mode: embedding}
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: http://127.0.0.1:8013/v1
      api_key: none

  - model_name: qwen-image-edit           # dgx-spark
    model_info: {mode: image_generation}
    litellm_params:
      model: openai/qwen-image-edit
      api_base: http://127.0.0.1:8102/v1
      api_key: os.environ/IMAGE_API_KEY
      timeout: 600

  - model_name: qwen-image-edit           # dgx-spark-2
    model_info: {mode: image_generation}
    litellm_params:
      model: openai/qwen-image-edit
      api_base: http://100.64.0.12:8102/v1
      api_key: os.environ/IMAGE_API_KEY
      timeout: 600

router_settings:
  routing_strategy: least-busy
  num_retries: 1
  timeout: 600

litellm_settings:
  request_timeout: 600
  drop_params: false               # never drop the image URL-contract fields
  json_logs: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  user_api_key_cache_ttl: 10       # a revoked key dies on every worker within 10 s (default 60)
