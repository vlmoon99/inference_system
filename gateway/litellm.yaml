# LiteLLM Proxy: the one door every project uses. Model names here are the public API ids.
# This file is the same on every node. Each model points at the local balancer (gateway/Caddyfile), which
# spreads it over the nodes that serve it:
#   core models      run on every node; adding a node to NODES is all it takes
#   non-core models  run on some nodes; add them at the bottom, with their balancer block in the Caddyfile
model_list:
  # ---- core
  - model_name: qwen3.6-35b
    model_info: {mode: chat}
    litellm_params:
      model: hosted_vllm/nvidia/Qwen3.6-35B-A3B-NVFP4
      api_base: http://127.0.0.1:18010/v1
      api_key: os.environ/ENGINE_KEY
      timeout: 600

  - model_name: qwen3-embedding-0.6b
    model_info: {mode: embedding}
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: http://127.0.0.1:18013/v1
      api_key: os.environ/ENGINE_KEY

  - model_name: qwen-image-edit
    model_info: {mode: image_generation}
    litellm_params:
      model: openai/qwen-image-edit
      api_base: http://127.0.0.1:18102/v1
      api_key: os.environ/IMAGE_API_KEY
      timeout: 600

  # ---- non-core (example: a model only dgx-spark-2 serves, balancer block :18200 in the Caddyfile)
  # - model_name: some-video-model
  #   litellm_params:
  #     model: openai/some-video-model
  #     api_base: http://127.0.0.1:18200/v1
  #     api_key: os.environ/ENGINE_KEY
  #     timeout: 1800

router_settings:
  num_retries: 2                   # a request cut off by a dying node is sent again; the balancer picks a live one
  timeout: 600

litellm_settings:
  request_timeout: 600
  drop_params: false               # never drop the image URL-contract fields
  json_logs: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_prompts_in_spend_logs: false
  disable_spend_logs: false
  user_api_key_cache_ttl: 10       # a revoked key dies on every worker within 10 s (default 60)
