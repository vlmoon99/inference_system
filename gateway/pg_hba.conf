# The stock postgres image's rules plus one line: the `replicator` login may stream (followers of the master).
# The port is published on the tailnet IP; Docker hands those connections over from its gateway address, so
# they can't be told apart from local ones here: every non-loopback login needs its password.
local   all           all                             trust
host    all           all          127.0.0.1/32       trust
host    all           all          ::1/128            trust
local   replication   all                             trust
host    replication   all          127.0.0.1/32       trust
host    replication   all          ::1/128            trust
host    replication   replicator   all                scram-sha-256
host    all           all          all                scram-sha-256
