# The part of the stack that is the SAME on every node (hosts/<host>/compose.yaml includes it and adds what
# only that machine has). Paths are relative to the host directory; values come from its .env.
#
# Every node runs: the core models (LLM, embeddings, Qwen-Edit), a load balancer over the core models of ALL
# nodes, a gateway (LiteLLM), the gateway's database, the node-agent and the admin console.
# So every node answers at http://<its tailnet IP>:8000 and a request is served by whichever node has room.
# The gateway's database (project keys, usage) has one master; the others are live standbys of it.
# deploy/node.sh (user unit inf-node.service) keeps that role and starts everything: don't `compose up` by hand.

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

services:
  # ---- core models: listen on the tailnet IP so every node's balancer reaches them; each needs a key,
  # ---- so a tailnet device cannot go around the gateway's project keys
  llm:
    image: vllm-node:latest
    pull_policy: never              # no Dockerfile exists: `docker save | ssh <node> docker load` to add a node
    container_name: inf-llm
    network_mode: host
    ipc: host
    shm_size: 32g
    <<: *gpu
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"
      HF_HOME: /cache/huggingface
      VLLM_MARLIN_USE_ATOMIC_ADD: "1"
    volumes: ["${HF_CACHE}:/cache/huggingface"]
    command: >
      vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 --served-model-name nvidia/Qwen3.6-35B-A3B-NVFP4
      --host ${TAILNET_IP} --port 8010 --api-key ${ENGINE_KEY}
      --tensor-parallel-size 1 --trust-remote-code --kv-cache-dtype fp8
      --attention-backend flashinfer --moe-backend marlin --gpu-memory-utilization ${LLM_GPU_UTIL:-0.26}
      --max-model-len 24576 --max-num-seqs 8 --max-num-batched-tokens 8192 --enable-chunked-prefill
      --enable-prefix-caching --load-format fastsafetensors --reasoning-parser qwen3
      --tool-call-parser qwen3_xml --enable-auto-tool-choice
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://${TAILNET_IP}:8010/health')"]
      interval: 30s
      start_period: 900s

  embed:
    image: product_dream-svc-embed:latest
    pull_policy: never              # no Dockerfile exists either
    container_name: inf-embed
    network_mode: host
    <<: *gpu
    restart: unless-stopped
    working_dir: /svc
    environment:
      DEVICE: cuda
      HF_HOME: /data/models
      HF_HUB_OFFLINE: "1"
      QWEN3_EMBED_MODEL: Qwen/Qwen3-Embedding-0.6B
      API_KEY: ${ENGINE_KEY}
    volumes:
      - "${HF_CACHE}:/data/models"
      - "../../services/embed:/svc:ro"
    command: uvicorn app:app --host ${TAILNET_IP} --port 8013 --no-access-log

  comfyui:
    build:
      context: ../../services/comfyui
      args: {BASE: "${COMFY_BASE:-pd-comfyui:base}"}     # a local image on each box (no Dockerfile for it)
    image: inf/comfyui:local
    container_name: inf-comfyui
    network_mode: host
    ipc: host
    <<: *gpu
    restart: unless-stopped
    volumes: ["${COMFY_DIR}:/comfy"]
    command: bash -lc "cd /comfy && python main.py --listen 127.0.0.1 --port 8188 --disable-async-offload --disable-dynamic-vram --highvram"

  image:
    build: ../../services/image
    image: inf/image:local
    container_name: inf-image
    network_mode: host
    restart: unless-stopped
    environment:
      COMFY_URL: http://127.0.0.1:8188
      API_KEY: ${IMAGE_API_KEY}
      BIND: ${TAILNET_IP}
      PORT: "8102"
    depends_on: [comfyui]

  # ---- one local address per model, spread over every node that serves it (gateway/Caddyfile):
  # ---- health-checked every 5 s, so a dead node costs nothing and a returning one is used again
  lb:
    image: caddy:2.10.0-alpine
    container_name: inf-lb
    network_mode: host
    restart: unless-stopped
    environment:
      NODES: ${NODES}
    volumes: ["../../gateway/Caddyfile:/etc/caddy/Caddyfile:ro"]
    entrypoint:
      - sh
      - -c
      - |
        up() { for n in $$NODES; do printf '%s:%s ' "$${n%%/*}" "$$1"; done; }
        export CORE_LLM="$$(up 8010)" CORE_EMBED="$$(up 8013)" CORE_IMAGE="$$(up 8102)"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile

  # ---- the gateway and its database
  litellm-db:
    image: postgres:17
    container_name: inf-litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf", "-c", "max_slot_wal_keep_size=4GB"]
    ports:
      - "127.0.0.1:5440:5432"
      - "${TAILNET_IP}:5440:5432"         # followers stream from the master; the other gateways write to it
    volumes:
      - "litellm_pg:/var/lib/postgresql/data"
      - "../../gateway/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s

  litellm:
    image: ghcr.io/berriai/litellm-database:main-stable@sha256:5a9ff0fd7177372f2ccd8949cb121f67e281f4d13d026af51f9c096c0626f50a   # 1.104.2
    container_name: inf-litellm
    network_mode: host
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ENGINE_KEY: ${ENGINE_KEY}
      IMAGE_API_KEY: ${IMAGE_API_KEY}
      # keys and usage are written to the MASTER's database (node.sh sets MASTER_IP; 127.0.0.1 on the master)
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@${MASTER_IP:-127.0.0.1}:5440/litellm
      DISABLE_ADMIN_UI: "True"
      STORE_MODEL_IN_DB: "False"
    volumes: ["../../gateway/litellm.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--host", "${TAILNET_IP}", "--port", "8000", "--num_workers", "1"]
    depends_on:
      litellm-db: {condition: service_healthy}
      lb: {condition: service_started}

  node-agent:
    build: ../../services/node-agent
    image: inf/node-agent:local
    container_name: inf-node-agent
    network_mode: host
    <<: *gpu
    restart: unless-stopped
    environment:
      AGENT_TOKEN: ${AGENT_TOKEN}
      HOST_NAME: ${HOST_NAME}
      PROJECT: inf
      BIND: ${TAILNET_IP}
      PORT: "8090"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]

  admin:                           # on every node: reads the local copy of the database, writes through the gateway
    build: ../../services/admin
    image: inf/admin:local
    container_name: inf-admin
    network_mode: host
    restart: unless-stopped
    environment:
      BIND: ${TAILNET_IP}
      PORT: "8091"
      LITELLM_URL: http://${TAILNET_IP}:8000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DB_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@127.0.0.1:5440/litellm
      AGENT_TOKEN: ${AGENT_TOKEN}
      NODES: ${ADMIN_NODES}
    volumes: ["admin_data:/data"]

  backup:                          # keys + usage: pg_dump at start and every 24 h (a failed one retries in 5 min), 14 days kept
    image: postgres:17
    container_name: inf-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${LITELLM_DB_PASSWORD}
    volumes: ["${BACKUP_DIR:-../../.data/backups}:/backups"]
    entrypoint: ["bash", "-c", "while true; do f=/backups/litellm-$$(date -u +%Y%m%dT%H%M).dump; if pg_dump -h litellm-db -U litellm -Fc litellm > $$f.tmp && mv $$f.tmp $$f; then echo backup $$f $$(du -h $$f | cut -f1); find /backups -name 'litellm-*.dump' -mtime +14 -delete; sleep 86400; else rm -f $$f.tmp; echo 'backup FAILED, again in 5 min'; sleep 300; fi; done"]
    depends_on:
      litellm-db: {condition: service_healthy}

volumes:
  admin_data:
  litellm_pg:
